<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' blob: data:">
  <title>Deskscape</title>
  <link rel="stylesheet" href="css/deskscape.css">
</head>
<body>
  <div id="bg" aria-hidden="true">
    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
    <video id="bg-video" muted loop playsinline hidden></video>
  </div>
  <canvas id="scene" aria-label="3D desktop scene"></canvas>
  <div id="vignette" aria-hidden="true"></div>
  <div id="grain" aria-hidden="true"></div>
  <main id="widgets" aria-label="Desktop widgets"></main>
  <div id="drawer" hidden></div>

  <button id="edit-button" type="button" title="Customize (Ctrl+E)" aria-label="Customize desktop">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4zM14 6l4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

  <aside id="editor" class="panel" aria-label="Customize" hidden></aside>
  <div id="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
